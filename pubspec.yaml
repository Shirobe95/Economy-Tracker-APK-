name: economy_tracker
description: "Control financiero personal y prevision, local-first."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegacion (DEC-001).
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

  # Persistencia local (DEC-001): Drift + SQLite, sin backend (DEC-002).
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path: ^1.9.1
  path_provider: ^2.1.5

  intl: ^0.20.2

  # Corte K: copia de seguridad y bloqueo local.
  share_plus: ^11.0.0
  file_picker: ^10.0.0
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  local_auth: ^2.3.0

dev_dependencies:
  # Solo para los tests: el doble de LocalAuthentication tiene que declarar
  # los mismos tipos que la interfaz de plataforma.
  local_auth_platform_interface: ^1.0.10
  flutter_test:
    sdk: flutter
  # Solo para tests: la implementacion en memoria de las preferencias.
  shared_preferences_platform_interface: ^2.4.1
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
