name: economy_tracker
description: "Control financiero personal y prevision, local-first."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegacion (DEC-001).
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

  # Persistencia local (DEC-001): Drift + SQLite, sin backend (DEC-002).
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path: ^1.9.1
  path_provider: ^2.1.5

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
